<!DOCTYPE html>
<html><head><title>STEVETECH Admin Post</title>
<style>body{font-family:Arial;max-width:500px;margin:auto;padding:20px}input,textarea{width:100%;padding:10px;margin:5px 0}button{padding:12px;background:green;color:white;border:none;width:100%;cursor:pointer}</style>
</head><body>
<h2>STEVETECH - Post New Work</h2>
<p>1. Upload picha GitHub > images > work7.jpg etc</p>
<input id="title" placeholder="Title e.g. Solar Installation Kitui">
<input id="img" placeholder="Image e.g. images/work7.jpg">
<textarea id="desc" placeholder="Description"></textarea>
<button onclick="generate()">Generate Post + WhatsApp Status</button>
<div id="out" style="margin-top:20px;white-space:pre-wrap;background:#f0f0f0;padding:15px"></div>
<script>
function generate(){
let t=document.getElementById('title').value;
let i=document.getElementById('img').value;
let d=document.getElementById('desc').value;
let code = `
<!-- COPY TO services.html -->
<div class="work-card">
  <img src="${i}" alt="${t}">
  <div class="work-info"><div class="work-title">${t}</div><div class="work-desc">${d}</div></div>
</div>

// COPY TO posts.js
{
  title: "${t}",
  description: "${d} Call 0706866177",
  image: "${i}",
  date: "${new Date().toISOString().split('T')[0]}",
  author: "STEVETECH"
},
`;
let wa = `*${t}*%0A${d}%0A%0APhotos: https://emanuelkitili.github.io/stevetech-website/news.html%0ACall: 0706866177`;
code += "\n\nWHATSAPP STATUS CAPTION:\n" + decodeURIComponent(wa) + "\n\nWhatsApp Link:\nhttps://wa.me/?text=" + wa;
document.getElementById('out').innerText = code;
}
</script>
</body></html>
